name: Generation fence

on:
  pull_request:
    branches: ["**"]
    paths:
      - "experiments/odex_gax_imx_reference/generation_fence.py"
      - "experiments/odex_gax_imx_reference/gax_ref_runtime.py"
      - "tests/test_generation_fence.py"
      - "docs/generation-fence.md"
      - ".github/workflows/generation-fence.yml"
  push:
    branches:
      - "worker/o6-p2a-generation-fence"
    paths:
      - "experiments/odex_gax_imx_reference/generation_fence.py"
      - "experiments/odex_gax_imx_reference/gax_ref_runtime.py"
      - "tests/test_generation_fence.py"
      - "docs/generation-fence.md"
      - ".github/workflows/generation-fence.yml"

permissions:
  contents: read

jobs:
  bounded-generation-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded workbench
        run: python -m pip install -e '.[dev]'
      - name: Run generation-fence qualification
        run: python -m pytest -q tests/test_generation_fence.py
