# Cross-component suite delegated to its canonical testing repository.
name: Tests
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - '**'
permissions:
  contents: read
jobs:
  native:
    name: Component-local checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -e '.[dev]'
    - run: python -m pytest -q tests
      env:
        PYTHONPATH: .:src
        PYTHONDONTWRITEBYTECODE: '1'
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-governed-exchange--tests.yml@39f038435afdd71ba162860faa5718d90d7bde64
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 39f038435afdd71ba162860faa5718d90d7bde64
    permissions:
      contents: read
