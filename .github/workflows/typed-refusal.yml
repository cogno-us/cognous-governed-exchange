name: Truthful typed refusal candidate provenance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cogno-us/cognous-control-plane
          ref: c7f122ba3a6e39f9268a7163c99be3ee514cd97e
          path: pinned/control-plane
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 63bd4d8d33130de9cc1d3ab3031bd585f2b4e09e
          path: pinned/executor
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cogno-us/cognous-action-manifest
          ref: 46c950bed37fe3812000895430bc0312d29e37ce
          path: pinned/manifest
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: 24fa957142f3dda73cbfc29850e68529e5fed9b1
          path: pinned/replay
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cogno-us/open-decision-evidence-standard
          ref: da4f1976407523ab5e7a6aa2e953ffbb56e37712
          path: pinned/odes
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cogno-us/cognous-governance-evidence-pack
          ref: 74cd70aaace4104e0b352a7bc3027e7b5d89e583
          path: pinned/pack
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install -e pinned/replay -e pinned/odes -e pinned/pack
      - name: Verify exact source checkouts
        run: |
          test "$(git -C pinned/control-plane rev-parse HEAD)" = "c7f122ba3a6e39f9268a7163c99be3ee514cd97e"
          test "$(git -C pinned/executor rev-parse HEAD)" = "63bd4d8d33130de9cc1d3ab3031bd585f2b4e09e"
          test "$(git -C pinned/manifest rev-parse HEAD)" = "46c950bed37fe3812000895430bc0312d29e37ce"
          test "$(git -C pinned/replay rev-parse HEAD)" = "24fa957142f3dda73cbfc29850e68529e5fed9b1"
      - run: python -m pytest -q candidate_qualification/test_typed_refusal_profile.py --junitxml=refusal-results.xml
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .
          GAX_RUNTIME_COMPATIBILITY_PROFILE: typed-refusal-candidate-20261015
          MOLTBOT_SAFE_CONTROL_PLANE_ROOT: ${{ github.workspace }}/pinned/control-plane
          MOLTBOT_SAFE_ROOT: ${{ github.workspace }}/pinned/executor
          UPSTREAM_MANIFEST_EXAMPLE: ${{ github.workspace }}/pinned/manifest/examples/refund_integration_v1_1.manifest.json
          ARB_REFUSAL_CP_ROOT: ${{ github.workspace }}/pinned/control-plane
          ARB_REFUSAL_EXECUTOR_ROOT: ${{ github.workspace }}/pinned/executor
          ARB_PINNED_MANIFEST_FIXTURE: ${{ github.workspace }}/pinned/manifest/examples/refund_integration_v1_1.manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: typed-refusal-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: refusal-results.xml
          if-no-files-found: error
